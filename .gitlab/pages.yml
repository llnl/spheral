create-pages:
  extends: [.toss_perf_resource]
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  stage: deploy
  # Prevent this job from collecting artifacts
  dependencies: []
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Deploy"'
    - if: '$CI_COMMIT_MESSAGE =~ /test-deploy/'
  script:
    - source $HOME/docsvenv/bin/activate
    - srun -n 8 --cpus-per-task 14 python3 $SCRIPT_DIR/lc/plot_hist_data.py --threads 14
  artifacts:
    paths:
      - public
