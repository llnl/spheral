# ------------------------------------------------------------------------------
# UPDATE TPL JOBS

toss_update_tpls:
  extends: [.toss_resource2, .update_tpls]

cray_update_tpls:
  extends: [.cray_resource2, .update_tpls]
  needs: [toss_update_tpls]

# ------------------------------------------------------------------------------
# UPDATE PERM JOBS

shared_tpls_update_permissions:
  extends: [.toss_resource_general, .toss_update_permissions]

# ------------------------------------------------------------------------------
# PROD BUILD JOBS

### TAG RELEASE ###
toss_build_dev_pkg_release:
  extends: [.toss_resource_general, .build_dev_pkg]

toss_install_dev_pkg_release:
  extends: [.toss_resource_general, .install_dev_pkg]
  needs: [toss_build_dev_pkg_release]

toss_release_permissions:
  variables:
    ALIAS: $CI_COMMIT_TAG
  extends: [.toss_resource_general, .prod_permissions]
  needs: [toss_install_dev_pkg_release]
