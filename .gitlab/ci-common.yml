workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ALLOC_NAME: ${CI_PROJECT_NAME}_ci_${CI_PIPELINE_ID}
  BUILD_ROOT: ${CI_PROJECT_DIR}

  SCRIPT_DIR: "scripts"
  ATS_FILE: "tests/integration.ats"
  PERF_ATS_FILE: "tests/run_perf.py"
  SPHERAL_MODULE: "Spheral"
  SPACK_PKG_NAME: spheral
  DEV_PKG_SPEC: "spheral@develop+mpi~caliper~network%gcc"

.spheral_rev_str:
  before_script:
    - SPHERAL_REV=$(git rev-list --count HEAD)
    - SPHERAL_REV_STR="$SPHERAL_REV"

stages:
  - init
  - dispatch
  - update_tpls
  - generate_buildcache
  - install_production
  - update_permissions
  - tpls
  - build_and_install
  - perf_install
  - run_ats
  - run_perf
  - cleanup
  - deploy

include:
  - local: .gitlab/os.yml
  - local: .gitlab/machines.yml
