<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Artificial viscosity managed pointer flow</title>
  <desc id="desc">Flow from the host ArtificialViscosity object through getScalarView or getTensorView to a managed base pointer captured by a RAJA lambda and used for QPiij calls on device.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .rail { fill: none; stroke: #bfdbfe; stroke-width: 8; stroke-linecap: round; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow); }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .cardPrimary { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .label { font: 700 13px Arial, sans-serif; fill: #2563eb; letter-spacing: 0.5px; }
      .title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 13.5px Arial, sans-serif; fill: #334155; }
      .code { font: 700 14.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #0f172a; }
      .badge { fill: #2563eb; }
      .badgeText { font: 700 13px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1120" height="320"/>
  <path class="rail" d="M150 160 L970 160"/>

  <rect class="card" x="24" y="82" width="230" height="156" rx="8"/>
  <circle class="badge" cx="52" cy="110" r="15"/>
  <text class="badgeText" x="48" y="115">1</text>
  <text class="label" x="80" y="110">HOST OBJECT</text>
  <text class="title" x="44" y="146">ArtificialViscosity</text>
  <text class="text" x="44" y="176">Reports QPiTypeIndex()</text>
  <text class="text" x="44" y="200">Owns parameters and</text>
  <text class="text" x="44" y="224">managed view pointer</text>

  <path class="arrow" d="M254 160 L306 160"/>

  <rect class="cardPrimary" x="306" y="72" width="240" height="176" rx="8"/>
  <circle class="badge" cx="334" cy="100" r="15"/>
  <text class="badgeText" x="330" y="105">2</text>
  <text class="label" x="362" y="100">ACCESSOR</text>
  <text class="code" x="326" y="138">getScalarView()</text>
  <text class="text" x="326" y="164">or</text>
  <text class="code" x="326" y="190">getTensorView()</text>
  <text class="text" x="326" y="218">Creates or updates view</text>

  <path class="arrow" d="M546 160 L598 160"/>

  <rect class="card" x="598" y="72" width="252" height="176" rx="8"/>
  <circle class="badge" cx="626" cy="100" r="15"/>
  <text class="badgeText" x="622" y="105">3</text>
  <text class="label" x="654" y="100">MANAGED POINTER</text>
  <text class="code" x="618" y="138">chai::managed_ptr&lt;BaseView&gt;</text>
  <text class="text" x="618" y="172">Points at device-valid</text>
  <text class="text" x="618" y="196">concrete view object</text>

  <path class="arrow" d="M850 160 L902 160"/>

  <rect class="card" x="902" y="82" width="194" height="156" rx="8"/>
  <circle class="badge" cx="930" cy="110" r="15"/>
  <text class="badgeText" x="926" y="115">4</text>
  <text class="label" x="958" y="110">KERNEL</text>
  <text class="title" x="922" y="146">RAJA lambda</text>
  <text class="text" x="922" y="176">Captures pointer and</text>
  <text class="text" x="922" y="200">calls QPiij on device</text>
</svg>
