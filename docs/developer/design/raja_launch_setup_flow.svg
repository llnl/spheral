<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="330" viewBox="0 0 1180 330" role="img" aria-labelledby="title desc">
  <title id="title">RAJA launch setup flow</title>
  <desc id="desc">Flow from host objects through captured views, CHAI movement, RAJA forall execution, and CPU consumer boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .rail { fill: none; stroke: #bfdbfe; stroke-width: 8; stroke-linecap: round; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow); }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .cardPrimary { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .label { font: 700 12.5px Arial, sans-serif; fill: #2563eb; letter-spacing: 0.5px; }
      .titleText { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .code { font: 700 13.5px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #0f172a; }
      .badge { fill: #2563eb; }
      .badgeText { font: 700 12.5px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1180" height="330"/>
  <path class="rail" d="M130 165 L1050 165"/>

  <rect class="card" x="20" y="78" width="198" height="174" rx="8"/>
  <circle class="badge" cx="48" cy="106" r="15"/>
  <text class="badgeText" x="44" y="111">1</text>
  <text class="label" x="76" y="106">HOST OBJECTS</text>
  <text class="titleText" x="40" y="142">Gather state</text>
  <text class="text" x="40" y="172">Package, DataBase,</text>
  <text class="text" x="40" y="196">State, derivatives,</text>
  <text class="text" x="40" y="220">connectivity</text>

  <path class="arrow" d="M218 165 L266 165"/>

  <rect class="cardPrimary" x="266" y="68" width="210" height="194" rx="8"/>
  <circle class="badge" cx="294" cy="96" r="15"/>
  <text class="badgeText" x="290" y="101">2</text>
  <text class="label" x="322" y="96">CAPTURED OBJECTS</text>
  <text class="code" x="286" y="134">view()</text>
  <text class="text" x="286" y="162">or managed pointer</text>
  <text class="text" x="286" y="186">accessor returns</text>
  <text class="text" x="286" y="210">RAJA-captured state</text>

  <path class="arrow" d="M476 165 L524 165"/>

  <rect class="card" x="524" y="78" width="190" height="174" rx="8"/>
  <circle class="badge" cx="552" cy="106" r="15"/>
  <text class="badgeText" x="548" y="111">3</text>
  <text class="label" x="580" y="106">CHAI MOVEMENT</text>
  <text class="titleText" x="544" y="142">Move or touch</text>
  <text class="text" x="544" y="172">Prepare captured</text>
  <text class="text" x="544" y="196">storage for target</text>
  <text class="text" x="544" y="220">execution space</text>

  <path class="arrow" d="M714 165 L762 165"/>

  <rect class="cardPrimary" x="762" y="68" width="190" height="194" rx="8"/>
  <circle class="badge" cx="790" cy="96" r="15"/>
  <text class="badgeText" x="786" y="101">4</text>
  <text class="label" x="818" y="96">RAJA LOOP</text>
  <text class="code" x="782" y="134">RAJA::forall</text>
  <text class="text" x="782" y="164">Lambda captures</text>
  <text class="text" x="782" y="188">views by value and</text>
  <text class="text" x="782" y="212">uses atomics where</text>
  <text class="text" x="782" y="236">outputs are shared</text>

  <path class="arrow" d="M952 165 L1000 165"/>

  <rect class="card" x="1000" y="78" width="160" height="174" rx="8"/>
  <circle class="badge" cx="1028" cy="106" r="15"/>
  <text class="badgeText" x="1024" y="111">5</text>
  <text class="label" x="1056" y="106">CPU BOUNDARY</text>
  <text class="titleText" x="1020" y="142">Move back</text>
  <text class="text" x="1020" y="172">Only when later</text>
  <text class="text" x="1020" y="196">host-only code</text>
  <text class="text" x="1020" y="220">will read data</text>
</svg>
