packages:
  all:
    # This defaults us to machine specific flags of ivybridge which allows
    # us to run on broadwell as well
    target: [ivybridge]
    providers:
      blas: [openblas]
      lapack: [openblas]
      mpi: [mvapich2]
      pkgconfig: [pkg-config]
      pil: [py-pillow]
      jpeg: [libjpeg]
      zlib-api: [zlib]
  gcc:
    externals:
    - spec: gcc@13.3.1 languages:='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-13.3.1
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-13.3.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-13.3.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-13.3.1/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  llvm:
    externals:
    - spec: llvm@19.1.3+clang+flang~lld~lldb
      prefix: /usr/tce/packages/clang/clang-19.1.3-magic
      extra_attributes:
        compilers:
          c: /usr/tce/packages/clang/clang-19.1.3-magic/bin/clang
          cxx: /usr/tce/packages/clang/clang-19.1.3-magic/bin/clang++
          fortran: /usr/tce/packages/clang/clang-19.1.3-magic/bin/flang
        flags: {}
        environment: {}
        extra_rpaths: []
  cmake:
    version: [3.25.2]
    buildable: false
    externals:
    - spec: cmake@3.25.2
      prefix: /usr/tce/packages/cmake/cmake-3.25.2
  gmake:
    version: [4.2.1]
    buildable: false
    externals:
    - spec: gmake@4.2.1
      prefix: /usr
  git:
    version: [2.29.1]
    buildable: false
    externals:
    - spec: git@2.29.1+tcltk
      prefix: /usr/tce
  perl:
    version: [5.26.3]
    buildable: false
    externals:
    - spec: perl@5.26.3
      prefix: /usr

  mvapich2:
    externals:
    - spec: mvapich2@2.3.6 process_managers=slurm %gcc@13.3.1
      prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.6-gcc-13.3.1-magic
    - spec: mvapich2@2.3.7 process_managers=slurm %clang@19.1.3
      prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-clang-19.1.3
    buildable: false

