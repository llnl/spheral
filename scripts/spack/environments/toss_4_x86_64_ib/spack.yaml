spack:
  specs:
  - spheral+mpi%gcc
  - spheral~mpi%gcc
  - spheral+mpi%clang_gfortran
  view: false
  concretizer:
    unify: false
    reuse: false
    compiler_mixing: true
  develop:
    spheral:
      path: ../../../../
      spec: spheral@=develop
  'include:':
  - ../../configs/toss_4_x86_64_ib/packages.yaml
  - ../../configs/config.yaml
  - ../../configs/upstreams.yaml
  repos:
    spheral: ../../spack_repo/spheral
