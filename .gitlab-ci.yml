# This file is intentionally a small CI entry point. Shared configuration and
# branch routing formerly defined here now live in ci-common.yml and
# ci-dispatch.yml. For ordinary branch pushes, the dispatcher selects either
# ci-full.yml or ci-docs-only.yml; specialized top-level pipelines remain
# included here so their existing behavior is unchanged. Future specialized
# workflows can follow this pattern with their own ci-*.yml files and entry
# rules.
include:
  - local: .gitlab/ci-common.yml
  - local: .gitlab/ci-dispatch.yml
  # Specialized top-level pipelines remain independent of branch CI routing.
  - project: lc-templates/id_tokens
    file: id_tokens.yml
  - local: .gitlab/scripts.yml
  - local: .gitlab/specs.yml
  - local: .gitlab/performance.yml
  - local: .gitlab/jobs-prod.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "scheduled"'
        when: never
      - if: '$CI_COMMIT_TAG'
        when: always
  - local: .gitlab/pages.yml
